<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="ballGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0c0c0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main ball circle -->
  <circle cx="100" cy="100" r="90" fill="url(#ballGradient)" filter="url(#shadow)"/>
  
  <!-- Stitching lines -->
  <g stroke="#b0b0b0" stroke-width="1.5" fill="none" stroke-dasharray="3,2">
    <!-- Top horizontal panel stitch -->
    <path d="M 30,65 Q 100,60 170,65"/>
    
    <!-- Bottom horizontal panel stitch -->
    <path d="M 30,135 Q 100,140 170,135"/>
    
    <!-- Left curved stitch -->
    <path d="M 35,70 Q 30,100 35,130"/>
    
    <!-- Right curved stitch -->
    <path d="M 165,70 Q 170,100 165,130"/>
    
    <!-- Center vertical stitches -->
    <path d="M 100,63 L 100,137"/>
    
    <!-- Bottom center stitches -->
    <path d="M 85,140 Q 100,145 115,140"/>
    <path d="M 90,148 L 95,155"/>
    <path d="M 100,150 L 100,158"/>
    <path d="M 110,148 L 105,155"/>
  </g>
  
  <!-- Panel seams (darker lines) -->
  <g stroke="#909090" stroke-width="2" fill="none">
    <!-- Horizontal seams -->
    <path d="M 30,65 Q 100,60 170,65"/>
    <path d="M 30,135 Q 100,140 170,135"/>
    
    <!-- Center vertical seam -->
    <line x1="100" y1="63" x2="100" y2="137" stroke-width="2.5"/>
  </g>
  
  <!-- Highlight for 3D effect -->
  <ellipse cx="70" cy="70" rx="25" ry="20" fill="white" opacity="0.3"/>
</svg>